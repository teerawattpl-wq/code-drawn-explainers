<!doctype html>
<!--
  The page for one code-drawn film. The whole picture is drawn on one canvas, frame by frame,
  as a pure function of time: render(t). Same t, same picture. build.py copies this file to
  <story>/build/<lang>/index.html and fills in the size, the duration and the script list.
  Do not edit the copy; edit the story's own .js files and build again.
-->
<html lang="__LANG__">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__W__, height=__H__" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="timings.js"></script>
    <style>
      @font-face { font-family: "Pridi"; src: url("fonts/pridi-700.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "KanitL"; src: url("fonts/kanit-latin-900.woff2") format("woff2"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: __W__px; height: __H__px; overflow: hidden; background: #10142c; }
      #root, #stage, #cv { position: absolute; left: 0; top: 0; width: __W__px; height: __H__px; }
      #root { overflow: hidden; }
      /* A canvas can only use a font the page has already used, so use both here, unseen.
         Without this the first frame that shows text is drawn in a fallback font. */
      .fontwarm { position: absolute; left: 0; top: 0; opacity: 0; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DUR__" data-width="__W__" data-height="__H__">
      <div id="stage" class="clip" data-start="0" data-duration="__DUR__" data-track-index="0">
        <canvas id="cv" width="__W__" height="__H__"></canvas>
        <span class="fontwarm" style="font-family: 'KanitL'">0123?</span>
        <span class="fontwarm" style="font-family: 'Pridi'">กขค abc</span>
        <svg id="sampler" width="0" height="0" style="position: absolute"></svg>
      </div>
      <audio id="mix" class="clip" data-start="0" data-duration="__DUR__" data-track-index="1" src="audio/mix-final.wav" data-volume="1"></audio>
    </div>
__SCRIPTS__
    <script>
      // The renderer tells us the time; we draw that frame. GSAP is only the clock here.
      if (!paper) makePaper();
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
      tl.to({ clock: 0 }, { clock: 1, duration: window.T.dur, ease: "none" }, 0);
      window.addEventListener("hf-seek", (e) => render(e.detail.time));
      window.__timelines["main"] = tl;
      tl.seek(0);
      render(0);
    </script>
  </body>
</html>
